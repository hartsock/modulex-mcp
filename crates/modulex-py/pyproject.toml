# PyPI wheel for the modulex engine bindings: `pip install modulex-py`,
# `import modulex_py`. NOTE: bare `modulex` is TAKEN on PyPI — never use it.
#
# Build: `maturin build --release` (or `maturin develop` in a venv).

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "modulex-py"
description = "Deterministic, pluggable routine engine — embed it, register Python step handlers, serve MCP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "Shawn Hartsock", email = "hartsock@users.noreply.github.com" },
]
keywords = ["agent", "mcp", "routine", "automation", "dashboard", "morning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/hartsock/modulex-mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "modulex_py"
bindings = "pyo3"
features = ["pyo3/extension-module"]
