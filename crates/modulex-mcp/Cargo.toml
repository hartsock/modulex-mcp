[package]
name = "modulex-mcp"
description = "Stdio MCP server for the modulex routine engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Library target so modulex-py can reuse the server loop (serve_stdio from
# Python with Python-registered steps).
[lib]
name = "modulex_mcp"
path = "src/lib.rs"

[[bin]]
name = "modulex-mcp"
path = "src/main.rs"

[features]
# Plugins are feature-gated (FOUNDATION pillar C): default builds carry the
# reference plugin; --no-default-features builds the lean engine.
default = ["plugin-health"]
plugin-health = ["dep:modulex-plugin-health"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
modulex-core = { workspace = true }
modulex-plugin-health = { path = "../modulex-plugin-health", version = "=0.1.0", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
modulex-core = { workspace = true, features = ["test-support"] }
