[package]
name = "modulex-cli"
description = "Human CLI for the modulex routine engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "modulex"
path = "src/main.rs"

[features]
# Plugins are feature-gated (FOUNDATION pillar C): default builds carry the
# reference plugin; --no-default-features builds the lean engine.
default = ["plugin-health"]
plugin-health = ["dep:modulex-plugin-health"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
modulex-core = { workspace = true }
modulex-plugin-health = { path = "../modulex-plugin-health", version = "=0.1.0", optional = true }
tokio = { workspace = true }
