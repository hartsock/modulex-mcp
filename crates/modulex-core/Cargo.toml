[package]
name = "modulex-core"
description = "Deterministic, pluggable routine engine: config, steps, registry, reports, gated exec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["web"]
# The url-watch step: leashed fetching via agent-bridle-tool-web (net-axis
# Caveats + SSRF screening). Off → no reqwest/rustls in the build.
web = ["dep:agent-bridle-tool-web", "dep:blake3"]
# Exposes exec::test_support (MockSpawner, gate_with) to downstream crates'
# tests. Dev-dependencies only.
test-support = []

[dependencies]
agent-bridle-core = { workspace = true }
agent-bridle-tool-web = { workspace = true, optional = true }
agent-store = { workspace = true }
anyhow = { workspace = true }
blake3 = { workspace = true, optional = true }
rusqlite = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
shell-words = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Schema validation for the data-contract tests ONLY — runtime never
# validates (schemas are contracts, the test suite is the enforcement).
jsonschema = { version = "0.26", default-features = false }
