[workspace]
resolver = "2"
members = [
    "crates/modulex-core",
    "crates/modulex-cli",
    "crates/modulex-mcp",
    "crates/modulex-plugin-health",
    "crates/modulex-py",
]

# 0.1.x semver line (Shawn, 2026-06-05): first publish = 0.1.0, cut manually
# once modulex has been tested in a few places.
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Shawn Hartsock <hartsock@users.noreply.github.com>"]
repository = "https://github.com/hartsock/modulex-mcp"

[workspace.dependencies]
modulex-core = { path = "crates/modulex-core", version = "=0.1.0" }

agent-bridle-core = "0.1.0"
agent-bridle-tool-web = "0.1.0"
anyhow = "1.0"
blake3 = "1.8"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Maintained drop-in for the deprecated/unmaintained serde_yaml — parses the
# knowledge-board card frontmatter (refs map + blocked_on list) for the
# markdown round-trip (board_md).
serde_yaml_ng = "0.10"
shell-words = "1.1"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "io-std"] }
toml = "0.8"
