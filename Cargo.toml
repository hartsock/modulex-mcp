[workspace]
resolver = "2"
members = ["crates/modulex-core", "crates/modulex-cli", "crates/modulex-mcp"]

[workspace.package]
version = "0.6.20260605"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Shawn Hartsock <hartsock@users.noreply.github.com>"]
repository = "https://github.com/hartsock/modulex-mcp"

[workspace.dependencies]
modulex-core = { path = "crates/modulex-core", version = "=0.6.20260605" }

agent-bridle-core = "0.1.0"
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "io-std"] }
toml = "0.8"
